metadata:
  title: Lelit Elizabeth - CN10 signal pigtail
  description: Gicar 8.5.04 power card 9600077 to GaggiMate Pro Rev 1.1 UART port J4

  templates:
    - &lv
      gauge: 28 AWG

connectors:
  CN10:
    type: Lelit 9600042 / TE 280372-1
    subtype: female, 6 pos, 2.54mm
    pinlabels: [+12V, TX_TO_GICAR, RX_FROM_GICAR, GND, 3V3_OLED, 3V3_MCU]
    notes: Gicar power card. Red wire is pin 6. Pins 1, 5, 6 cut back and insulated - never bond them to the Pro 3V3 rail.

  DIVIDER:
    type: Resistor pack
    subtype: heatshrink, board end
    pinlabels: [TX_GICAR, RX_GICAR, TX_BOARD, RX_BOARD, GND]
    notes: R3 220R series on TX. R1 1k plus R2 1.5k divider on RX gives 3.0 V at GPIO44. Source impedance 600R.

  J4:
    type: JST XH
    subtype: female, 4 pos
    pinlabels: [+5V, TX_GPIO43, RX_GPIO44, GND]
    notes: GaggiMate Pro Rev 1.1 UART port. +5V left unconnected - do not back-feed.

cables:
  W1:
    <<: *lv
    colors: [WH, GN, BK]
    length: 0.3
    notes: Gicar side. Plain wire, no components in this run.
  W2:
    <<: *lv
    colors: [WH, GN, BK]
    length: 0.05
    notes: Board side pigtail.

connections:
  -
    - CN10: [2, 3, 4]
    - W1: [1, 2, 3]
    - DIVIDER: [1, 2, 5]
  -
    - DIVIDER: [3, 4, 5]
    - W2: [1, 2, 3]
    - J4: [2, 3, 4]

additional_bom_items:
  - description: Resistor, 220R, 1/4W - TX series
    designators: [R3]
    qty: 1
  - description: Resistor, 1k, 1/4W - RX divider upper
    designators: [R1]
    qty: 1
  - description: Resistor, 1.5k, 1/4W - RX divider lower
    designators: [R2]
    qty: 1
  - description: Heatshrink, 6mm, over resistor pack
    qty: 1
  - description: TVS diode, 3.6V, on RX node (optional)
    designators: [D1]
    qty: 1
